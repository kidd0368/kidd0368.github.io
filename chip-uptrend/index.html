<title>籌碼上漲追蹤（受密碼保護）</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f9f9f7; color:#0b0b0b;
         font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
  @media (prefers-color-scheme: dark){ body{ background:#0d0d0d; color:#fff; }
    .box{ background:#1a1a19 !important; border-color:rgba(255,255,255,.1) !important; }
    input{ background:#0d0d0d !important; color:#fff !important; border-color:rgba(255,255,255,.2) !important; }
  }
  .box { background:#fcfcfb; border:1px solid rgba(11,11,11,.1); border-radius:14px;
         padding:34px 38px; width:340px; text-align:center;
         box-shadow:0 8px 30px rgba(0,0,0,.06); }
  h1 { font-size:17px; margin:0 0 6px; }
  p { font-size:13px; color:#898781; margin:0 0 18px; }
  input { width:100%; box-sizing:border-box; font-size:15px; padding:10px 12px;
          border:1px solid rgba(11,11,11,.2); border-radius:8px; margin-bottom:12px;
          text-align:center; letter-spacing:1px; }
  button { width:100%; font-size:14px; font-weight:600; padding:10px; border:0;
           border-radius:8px; background:#2a78d6; color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:#d03b3b; font-size:13px; margin-top:10px; min-height:18px; }
</style>
</head>

</div>

const ITER = 600000;
async function unlock(){
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  btn.disabled = true; err.textContent = '解密中…';
  try {
    const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
    const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false;
    err.textContent = '密碼錯誤，請再試一次';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
