<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>產業情報研究系統</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b111a; }
    #hub-frame { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="hub-frame" src="app.html" title="產業情報研究系統" allow="clipboard-write"></iframe>
  <script>
    const frame = document.getElementById('hub-frame');
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        const titleInput = doc && doc.getElementById('source-title');
        const titleField = titleInput && titleInput.closest('.field');
        if (titleField) titleField.style.display = 'none';
      } catch (error) {
        console.warn('Unable to hide automatic title field', error);
      }
    });
  </script>
</body>
</html>
