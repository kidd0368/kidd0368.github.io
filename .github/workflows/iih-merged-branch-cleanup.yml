name: IIH one-shot merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/iih-branch-cleanup.trigger"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged feature branch and self-clean
        run: |
          set -euo pipefail
          git push origin --delete fix/iih-github-completion-gate || true
          git config user.name "industry-intelligence-bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/iih-merged-branch-cleanup.yml .github/iih-branch-cleanup.trigger
          git commit -m "chore: finish completion-gate cleanup"
          git push origin HEAD:main
