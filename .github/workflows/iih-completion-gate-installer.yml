name: IIH completion-gate PR installer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  install-and-test:
    if: github.head_ref == 'fix/iih-github-completion-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install browser completion gate
        run: python3 industry-intelligence-hub/scripts/install_completion_gate.py

      - name: Validate source
        run: |
          node --check industry-intelligence-hub/completion-gate.js
          python3 -m py_compile \
            industry-intelligence-hub/scripts/enrich_completion_receipts.py \
            industry-intelligence-hub/scripts/verify_completion_gate.py \
            industry-intelligence-hub/scripts/install_completion_gate.py
          python3 -m json.tool industry-intelligence-hub/data/registry.json >/dev/null
          grep -q 'completion-gate.js?v=1.0.0' industry-intelligence-hub/app.html

      - name: Commit installed script tag to PR branch
        run: |
          set -euo pipefail
          if git diff --quiet -- industry-intelligence-hub/app.html; then
            echo "app.html already contains the completion gate."
            exit 0
          fi
          git config user.name "industry-intelligence-bot"
          git config user.email "actions@github.com"
          git add industry-intelligence-hub/app.html
          git commit -m "industry-intelligence: load browser completion gate"
          git push origin HEAD:${{ github.head_ref }}
