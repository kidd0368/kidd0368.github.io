name: Patch Industry Intelligence - automatic task title

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-industry-intelligence-hide-title.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-industry-intelligence-hide-title
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove manual task-title work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("industry-intelligence-hub/index.html")
          text = path.read_text(encoding="utf-8")
          old = '''                <div class="field span-8">
                  <label for="source-title">本次研究主題／資料包名稱</label>
                  <input id="source-title" placeholder="選擇附件後自動產生，也可自行修改">
                  <div class="help">用來辨識日後的研究紀錄，不是要重抄每份報告標題。多份附件會依產業、公司與檔案數自動命名；若附件沒有共同研究問題，應分開建立任務。</div>
                </div>'''
          new = '''                <input id="source-title" type="hidden" value="">'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one source-title block, found {count}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "industry-intelligence-bot"
          git config user.email "actions@github.com"
          git add industry-intelligence-hub/index.html
          git rm .github/workflows/patch-industry-intelligence-hide-title.yml
          git commit -m "industry-intelligence: make task title fully automatic"
          git push

# trigger
