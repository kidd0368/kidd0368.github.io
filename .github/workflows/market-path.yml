name: market-path-engine-update

on:
  schedule:
    - cron: "20 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-path-engine
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Market Path Engine
        run: |
          python market_path_engine/sync_catalog.py
          python market_path_engine/engine.py
          python market_path_engine/validate.py
          node --check market_path_engine/analysis_bundle.js

      - name: Commit data, archive and dashboard if changed
        run: |
          git config user.name "market-path-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-path/index.html market_path_engine/data
          if git diff --cached --quiet; then
            echo "No Market Path Engine changes."
          else
            git commit -m "market-path: auto update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
