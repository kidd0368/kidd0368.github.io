name: Patch Industry Intelligence multi-source naming

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-industry-intelligence-source-title.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-industry-intelligence-source-title
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_iih_source_title.py
          node --check industry-intelligence-hub/app.js
          git diff --check

      - name: Commit patch and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "industry-intelligence-bot"
          git config user.email "actions@github.com"
          git add industry-intelligence-hub/index.html industry-intelligence-hub/app.js
          git rm .github/workflows/patch-industry-intelligence-source-title.yml
          git rm .github/scripts/patch_iih_source_title.py
          git commit -m "industry-intelligence: clarify and automate source bundle title"
          git push
